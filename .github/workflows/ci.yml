name: API CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budget_asset_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: budget_asset_management_test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d

    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:ci
